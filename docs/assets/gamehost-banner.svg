<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">gamehost</title>
  <desc id="desc">Terminal-first manager for Core Keeper, Project Zomboid and Don't Starve Together dedicated servers.</desc>

  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5B6B7B" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1600" height="440" fill="#0B0F14"/>
  <rect width="1600" height="440" fill="url(#dots)"/>
  <rect x="12" y="12" width="1576" height="416" fill="none" stroke="#26333F" stroke-width="2"/>
  <rect x="12" y="12" width="120" height="4" fill="#F0A33B"/>

  <g font-family="'Noto Sans Mono', 'DejaVu Sans Mono', ui-monospace, monospace">
    <text x="64" y="86" fill="#7B8C9B" font-size="21" letter-spacing="5">TERMINAL-FIRST SERVER CONTROL</text>

    <text x="60" y="205" font-size="112" font-weight="bold" letter-spacing="-4">
      <tspan fill="#E9EFF5">game</tspan><tspan fill="#F0A33B">host</tspan>
    </text>
    <rect x="64" y="235" width="96" height="5" fill="#F0A33B"/>
    <text x="64" y="296" fill="#A8B6C3" font-size="27">install / configure / run / inspect / back up</text>
    <text x="64" y="370" fill="#627382" font-size="20" letter-spacing="1">$ gamehost</text>
    <rect x="202" y="352" width="12" height="22" fill="#F0A33B" opacity="0.9"/>

    <line x1="1000" y1="64" x2="1000" y2="376" stroke="#26333F" stroke-width="2"/>

    <text x="1040" y="86" fill="#7B8C9B" font-size="21" letter-spacing="5">SUPPORTED DRIVERS</text>

    <rect x="1042" y="128" width="11" height="11" fill="#4FB3A5"/>
    <text x="1074" y="144" fill="#E9EFF5" font-size="29">Core Keeper</text>
    <text x="1520" y="143" fill="#718292" font-size="21" text-anchor="end">1963720</text>
    <line x1="1040" y1="176" x2="1520" y2="176" stroke="#202B36" stroke-width="1"/>

    <rect x="1042" y="208" width="11" height="11" fill="#F0A33B"/>
    <text x="1074" y="224" fill="#E9EFF5" font-size="29">Project Zomboid</text>
    <text x="1520" y="223" fill="#718292" font-size="21" text-anchor="end">380870</text>
    <line x1="1040" y1="256" x2="1520" y2="256" stroke="#202B36" stroke-width="1"/>

    <rect x="1042" y="288" width="11" height="11" fill="#8A94E0"/>
    <text x="1074" y="304" fill="#E9EFF5" font-size="29">Don't Starve Together</text>
    <text x="1520" y="303" fill="#718292" font-size="21" text-anchor="end">343050</text>

    <text x="1040" y="370" fill="#627382" font-size="18" letter-spacing="3">STEAMCMD / SYSTEMD / TUI</text>
  </g>
</svg>
